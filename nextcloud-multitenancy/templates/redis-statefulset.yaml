{{- if .Values.redis.enabled }}
# =============================================================================
# Redis — shared StatefulSet (one per Helm release)
# =============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "redis.serviceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redis.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "redis.serviceName" . }}
  replicas: {{ .Values.redis.replicaCount }}
  selector:
    matchLabels:
      {{- include "redis.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "redis.labels" . | nindent 8 }}
        {{- include "redis.selectorLabels" . | nindent 8 }}
    spec:
      # -----------------------------------------------------------------------
      # OpenShift: no fsGroup/runAsUser — the platform injects an arbitrary UID
      # from the project's UID range. Only runAsNonRoot is safe to set.
      # -----------------------------------------------------------------------
      securityContext:
        runAsNonRoot: true
      serviceAccountName: {{ include "nextcloud.serviceAccountName" . }}
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              exec redis-server /usr/local/etc/redis/redis.conf \
                --requirepass "$REDIS_PASSWORD"
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.credentials.name }}
                  key: {{ .Values.redis.credentials.passwordKey }}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - name: redis-config
              mountPath: /usr/local/etc/redis
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-config
          configMap:
            name: {{ include "redis.serviceName" . }}-config
  volumeClaimTemplates:
    {{- if .Values.redis.persistence.enabled }}
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.redis.persistence.storageClass }}
        storageClassName: {{ .Values.redis.persistence.storageClass | quote }}
        {{- else if .Values.global.storageClass }}
        storageClassName: {{ .Values.global.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.redis.persistence.size }}
    {{- end }}
{{- end }}
