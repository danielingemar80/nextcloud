{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nextcloud.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nextcloud.labels" (dict "root" . "tenant" nil) | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
# =============================================================================
# OpenShift: bind the service account to the restricted-v2 SCC.
# restricted-v2 is the default on OCP 4.11+ and allows non-root workloads
# without requiring anyuid. If you need anyuid (e.g. for the nextcloud image
# that ships as www-data/33), change "restricted-v2" to "anyuid" and update
# the rolebinding subject accordingly, or use a Namespace-scoped SCC grant:
#
#   oc adm policy add-scc-to-user anyuid \
#     -z {{ include "nextcloud.serviceAccountName" . }} \
#     -n <namespace>
#
# Doing it declaratively via a ClusterRoleBinding keeps the chart self-contained.
# =============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "nextcloud.serviceAccountName" . }}-scc-restricted
  labels:
    {{- include "nextcloud.labels" (dict "root" . "tenant" nil) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  # system:openshift:scc:restricted-v2 is available on all OCP 4.11+ clusters.
  # Switch to system:openshift:scc:anyuid if images require a fixed UID.
  name: system:openshift:scc:restricted-v2
subjects:
  - kind: ServiceAccount
    name: {{ include "nextcloud.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
