{{/*
=============================================================================
Tenant Deployments — one Deployment per enabled tenant entry
Each pod: nextcloud (PHP-FPM) + nginx (reverse proxy)
All secrets referenced by name+key from externally-managed k8s Secrets
(Vault, SealedSecrets, ESO, etc.) — the chart never creates Secret objects.
=============================================================================
*/}}
{{- range .Values.tenants }}
{{- if .enabled }}
{{- $tenant := . }}
{{- $root := $ }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "nextcloud-%s" $tenant.name | trunc 63 }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "nextcloud.labels" (dict "root" $root "tenant" $tenant) | nindent 4 }}
  annotations:
    deployment.kubernetes.io/revision: "1"
spec:
  replicas: {{ $tenant.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "nextcloud.selectorLabels" (dict "root" $root "tenant" $tenant) | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "nextcloud.labels" (dict "root" $root "tenant" $tenant) | nindent 8 }}
        {{- include "nextcloud.selectorLabels" (dict "root" $root "tenant" $tenant) | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $root.Template.BasePath "/tenant-configmap.yaml") $root | sha256sum }}
        {{- with $tenant.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "nextcloud.serviceAccountName" $root }}
      # -----------------------------------------------------------------------
      # OpenShift: omit fsGroup / runAsUser — OCP injects an arbitrary UID from
      # the project's allocated UID range.  Setting a hard-coded UID here will
      # collide with the SCC and cause "unable to validate against any security
      # context constraint" admission errors unless you have explicitly granted
      # the nonroot or anyuid SCC.  runAsNonRoot is safe and still enforced.
      # -----------------------------------------------------------------------
      securityContext:
        runAsNonRoot: true
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      initContainers:
        - name: wait-for-redis
          # busybox ships as root by default; use the bitnami shell-utils image
          # which is already non-root and OpenShift-compatible.
          image: busybox:1.36
          # OpenShift: no runAsUser here; SCC handles it
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "redis.serviceName" $root }} 6379; do
                echo "Waiting for Redis..."; sleep 2;
              done
              echo "Redis is ready."

      containers:
        # -------------------------------------------------------------------
        # Container 1: Nextcloud PHP-FPM
        # -------------------------------------------------------------------
        - name: nextcloud
          image: "{{ $root.Values.image.repository }}:{{ $root.Values.image.tag }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          # OpenShift: drop capabilities and disallow escalation; no runAsUser
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          env:
            # -- Database --
            - name: MYSQL_HOST
              value: {{ $tenant.database.host | quote }}
            - name: MYSQL_DATABASE
              value: {{ $tenant.database.name | quote }}
            - name: MYSQL_USER
              value: {{ $tenant.database.user | quote }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $tenant.database.credentials.name }}
                  key: {{ $tenant.database.credentials.passwordKey }}

            # -- Nextcloud admin --
            - name: NEXTCLOUD_ADMIN_USER
              value: {{ $tenant.nextcloud.adminUser | quote }}
            - name: NEXTCLOUD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $tenant.nextcloud.credentials.name }}
                  key: {{ $tenant.nextcloud.credentials.adminPasswordKey }}

            # -- Redis --
            - name: REDIS_HOST
              value: {{ include "redis.serviceName" $root }}
            - name: REDIS_HOST_PORT
              value: "6379"
            - name: REDIS_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.redis.credentials.name }}
                  key: {{ $root.Values.redis.credentials.passwordKey }}

            # -- Nextcloud host & data dir --
            - name: NEXTCLOUD_TRUSTED_DOMAINS
              value: {{ $tenant.nextcloud.host | quote }}
            - name: NEXTCLOUD_DATA_DIR
              value: {{ $tenant.nextcloud.dataDir | default "/var/www/html/data" | quote }}

            # -- PHP config --
            - name: PHP_MEMORY_LIMIT
              value: {{ dig "phpConfig" "memory_limit" "512M" $tenant | quote }}
            - name: PHP_UPLOAD_LIMIT
              value: {{ dig "phpConfig" "upload_max_filesize" "10G" $tenant | quote }}

            {{- if $tenant.s3.enabled }}
            # -- S3 primary object storage credentials --
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $tenant.s3.credentials.name }}
                  key: {{ $tenant.s3.credentials.accessKeyKey }}
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $tenant.s3.credentials.name }}
                  key: {{ $tenant.s3.credentials.secretAccessKey }}
            {{- end }}

            {{- with $tenant.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          ports:
            - name: fpm
              containerPort: 9000
              protocol: TCP
          livenessProbe:
            exec:
              command:
                - php-fpm-healthcheck
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - php-fpm-healthcheck
                - --accepted-conn=50
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml $tenant.resources | nindent 12 }}
          volumeMounts:
            - name: nextcloud-html
              mountPath: /var/www/html
            - name: nextcloud-data
              mountPath: {{ $tenant.nextcloud.dataDir | default "/var/www/html/data" }}
            - name: php-fpm-config
              mountPath: /usr/local/etc/php-fpm.d/www.conf
              subPath: www.conf
            - name: nextcloud-config
              mountPath: /var/www/html/config/custom.config.php
              subPath: custom.config.php

        # -------------------------------------------------------------------
        # Container 2: Nginx reverse proxy
        # -------------------------------------------------------------------
        - name: nginx
          image: "{{ $root.Values.nginx.image.repository }}:{{ $root.Values.nginx.image.tag }}"
          imagePullPolicy: {{ $root.Values.nginx.image.pullPolicy }}
          # OpenShift: no runAsUser — OCP assigns UID; no NET_BIND_SERVICE needed
          # because we listen on 8080, not 80.
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nextcloud-html
              mountPath: /var/www/html
              readOnly: true
            # nginx needs writable temp dirs; mount emptyDirs over them so
            # the read-only image filesystem constraint is satisfied.
            - name: nginx-tmp
              mountPath: /tmp

      volumes:
        - name: nginx-config
          configMap:
            name: {{ printf "nextcloud-%s-nginx" $tenant.name }}
        - name: php-fpm-config
          configMap:
            name: {{ printf "nextcloud-%s-phpfpm" $tenant.name }}
        - name: nextcloud-config
          configMap:
            name: {{ printf "nextcloud-%s-config" $tenant.name }}
        - name: nginx-tmp
          emptyDir: {}
        {{- if $tenant.persistence.html.enabled }}
        - name: nextcloud-html
          persistentVolumeClaim:
            claimName: {{ printf "nextcloud-%s-html" $tenant.name }}
        {{- else }}
        - name: nextcloud-html
          emptyDir: {}
        {{- end }}
        {{- if $tenant.persistence.data.enabled }}
        - name: nextcloud-data
          persistentVolumeClaim:
            claimName: {{ printf "nextcloud-%s-data" $tenant.name }}
        {{- else }}
        - name: nextcloud-data
          emptyDir: {}
        {{- end }}

      {{- with $tenant.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $tenant.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $tenant.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
