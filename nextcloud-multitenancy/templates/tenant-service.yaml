{{/*
=============================================================================
Tenant Services — ClusterIP targeting the nginx port on each tenant's pods
=============================================================================
*/}}
{{- range .Values.tenants }}
{{- if .enabled }}
{{- $tenant := . }}
{{- $root := $ }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "nextcloud-%s" $tenant.name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "nextcloud.labels" (dict "root" $root "tenant" $tenant) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "nextcloud.selectorLabels" (dict "root" $root "tenant" $tenant) | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
{{- end }}
{{- end }}
